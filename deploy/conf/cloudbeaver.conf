# CloudBeaver Configuration for Pulsar Integration

{
  server: {
    serverPort: 8978,
    serverName: "PulseQL Server"
  },
  
  pulsar: {
    sso: {
      signingSecret: "${PULSAR_SSO_SECRET:change-in-production}",
      tokenMaxAgeMinutes: 15,
      expectedIssuer: "pulsar",
      expectedAudience: "pulseql"
    }
  }
}
