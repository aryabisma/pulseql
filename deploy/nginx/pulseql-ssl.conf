# nginx Configuration for Pulsar-PulseQL Integration
# Production-ready HTTPS and security configuration

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=sso_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/m;

# Upstream backend servers
upstream pulseql_backend {
    least_conn;
    server localhost:8978 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pulseql.example.com;
    
    # SSL Certificates
    ssl_certificate /etc/ssl/certs/pulseql.crt;
    ssl_certificate_key /etc/ssl/private/pulseql.key;
    
    # SSL Configuration - Modern, Secure with Strong Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # SSO Endpoint - Strict Rate Limiting
    location /api/sso/validate {
        limit_req zone=sso_limit burst=5 nodelay;
        proxy_pass http://pulseql_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # General API Endpoints
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://pulseql_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Static Files
    location / {
        root /var/www/pulseql/public;
        try_files $uri /index.html;
    }
}

# HTTP to HTTPS Redirect
server {
    listen 80;
    server_name pulseql.example.com;
    return 301 https://$server_name$request_uri;
}
